84.046 169 293 177.954 293 189 293 200.046 284.046 209 273 209 261.954 209 253 200.046 253 189Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_7--Slide2--5" class="fragment-off" data-fragment-index="1" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(268.179 196)" id="TextBox_8--Slide2--6" class="fragment-off" data-fragment-index="1">1</text><rect x="316" y="169" width="688" height="77" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_9--Slide2--7" class="fragment-off" data-fragment-index="1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(316.262 199)" id="TextBox_9--Slide2--8" class="fragment-off" data-fragment-index="1">Traditionally the work of Matthew, the tax collector</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(316.262 237)" id="TextBox_9--Slide2--9" class="fragment-off" data-fragment-index="1">Jesus called.</text><rect x="316" y="253" width="246" height="32" fill="#595959" fill-opacity="0.6" id="TextBox_10--Slide2--10" class="fragment-off" data-fragment-index="1" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="26.6667" transform="translate(316.262 278)" id="TextBox_10--Slide2--11" class="fragment-off" data-fragment-index="1">Matthew 9:9 and 10:3</text><path d="M259 342C259 330.954 267.954 322 279 322 290.046 322 299 330.954 299 342 299 353.046 290.046 362 279 362 267.954 362 259 353.046 259 342Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_11--Slide2--12" class="fragment-off" data-fragment-index="2" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(275.376 348)" id="TextBox_12--Slide2--13" class="fragment-off" data-fragment-index="2">2</text><rect x="316" y="319" width="719" height="38" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_13--Slide2--14" class="fragment-off" data-fragment-index="2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(316.262 349)" id="TextBox_13--Slide2--15" class="fragment-off" data-fragment-index="2">Written for readers who knew the Hebrew Scriptures.</text><rect x="316" y="366" width="705" height="33" fill="#595959" fill-opacity="0.6" id="TextBox_14--Slide2--16" class="fragment-off" data-fragment-index="2" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="26.6667" transform="translate(316.262 391)" id="TextBox_14--Slide2--17" class="fragment-off" data-fragment-index="2">Again and again it says a thing happened to fulfill the prophets.</text><path d="M260 487C260 475.954 268.954 467 280 467 291.046 467 300 475.954 300 487 300 498.046 291.046 507 280 507 268.954 507 260 498.046 260 487Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_15--Slide2--18" class="fragment-off" data-fragment-index="3" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(275.132 493)" id="TextBox_16--Slide2--19" class="fragment-off" data-fragment-index="3">3</text><rect x="316" y="469" width="715" height="38" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_17--Slide2--20" class="fragment-off" data-fragment-index="3" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="32" transform="translate(316.262 499)" id="TextBox_17--Slide2--21" class="fragment-off" data-fragment-index="3">Its claim: Jesus is the promised King, the Son of David</text><rect x="312" y="522" width="714" height="64" fill="#595959" fill-opacity="0.580392" id="TextBox_18--Slide2--22" class="fragment-off" data-fragment-index="3" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="26.6667" transform="translate(311.58 547)" id="TextBox_18--Slide2--23" class="fragment-off" data-fragment-index="3">The first verse says so; the last chapter sends His disciples to all</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="26.6667" transform="translate(311.58 579)" id="TextBox_18--Slide2--24" class="fragment-off" data-fragment-index="3">nations.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="700" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide2--25">Introduction to Matthew · Berean Standard Bible (BSB)</text><a id="Narration_Slide2--Slide2--26__LINK" href=""><g clip-path="url(#clip3--Narration_Slide2--Slide2--26)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide2--Slide2--26" style="display:none;"><g clip-path="url(#clip5--Narration_Slide2--Slide2--26)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide2--Slide2--26" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="193.5" y="77.5001" width="894" height="595" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide2--27" /></g></svg>