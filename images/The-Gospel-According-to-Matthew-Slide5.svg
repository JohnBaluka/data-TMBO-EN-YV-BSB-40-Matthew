ily="Carlito,sans-serif" font-weight="400" font-size="30" transform="translate(40.4 149)" id="ContentPlaceholder1--Slide6--9" class="fragment-off" data-fragment-index="1">and they will call Him Immanuel</text><text fill="#4A452A" font-family="Arimo,'Liberation Sans',sans-serif" font-weight="400" font-size="30" transform="translate(16.4 195)" id="ContentPlaceholder1--Slide6--10" class="fragment-off" data-fragment-index="1">•</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="30" transform="translate(40.4 195)" id="ContentPlaceholder1--Slide6--11" class="fragment-off" data-fragment-index="1">(which means, “God with us”).</text><text fill="#4A452A" font-family="Arimo,'Liberation Sans',sans-serif" font-weight="400" font-size="30" transform="translate(657.6 149)" id="ContentPlaceholder2--Slide6--12" class="fragment-off" data-fragment-index="2">•</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="30" transform="translate(681.6 149)" id="ContentPlaceholder2--Slide6--13" class="fragment-off" data-fragment-index="2">And surely I am with you always,</text><text fill="#4A452A" font-family="Arimo,'Liberation Sans',sans-serif" font-weight="400" font-size="30" transform="translate(657.6 195)" id="ContentPlaceholder2--Slide6--14" class="fragment-off" data-fragment-index="2">•</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="30" transform="translate(681.6 195)" id="ContentPlaceholder2--Slide6--15" class="fragment-off" data-fragment-index="2">even to the end of the age.</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(16.4 672)" id="ReferenceTextPlaceholder1--Slide6--16">Matthew 1:23</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1150.74 672)" id="ReferenceTextPlaceholder2--Slide6--17">Matthew 28:20</text><text fill="#4F81BD" font-family="