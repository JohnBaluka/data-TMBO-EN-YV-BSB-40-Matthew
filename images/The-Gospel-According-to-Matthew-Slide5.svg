te(688.433 671)" id="ReferenceTextPlaceholder2--Slide6--6">Matthew 28:20</text><text fill="#4A452A" font-family="Carlito,sans-serif" font-weight="700" font-size="17" transform="translate(9.6 705)" id="ReferenceTextPlaceholder_DUP2--Slide6--7">Matthew 1:23 and 28:20 · Berean Standard Bible (BSB)</text><g transform="matrix(0.000104987 0 0 0.000104987 116 73)" id="Content_Placeholder_20--Slide6--8"><g clip-path="url(#clip1--Content_Placeholder_20--Slide6--8)" transform="scale(1 1.0005)"><use width="100%" height="100%" xlink:href="#img0--Content_Placeholder_20--Slide6--8" transform="scale(6141.12 6141.12)"></use></g></g><rect x="701" y="93" width="415" height="32" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_7--Slide6--9" class="fragment-off" data-fragment-index="1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(700.573 118)" id="TextBox_7--Slide6--10" class="fragment-off" data-fragment-index="1">“ … And they will call Him Immanuel ”.</text><rect x="701" y="133" width="146" height="29" fill="#7F7F7F" fill-opacity="0.74902" id="TextBox_8--Slide6--11" class="fragment-off" data-fragment-index="1" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="24" transform="translate(700.573 155)" id="TextBox_8--Slide6--12" class="fragment-off" data-fragment-index="1">Matthew 1:23</text><rect x="490" y="176" width="698" height="64" fill="#595959" fill-opacity="0.4" id="TextBox_7_DUP2--Slide6--13" class="fragment-off" data-fragment-index="2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(490.345 201)" id="TextBox_7_DUP2--Slide6--14" class="fragment-off" data-fragment-index="2">“and teaching them to obey all that I have commanded you.</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(490.345 233)" id="TextBox_7_DUP2--Slide6--15" class="fragment-off" data-fragment-index="2">And</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(539.845 233)" id="TextBox_7_DUP2--Slide6--16" class="fragment-off" data-fragment-index="2">surely</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(610.825 233)" id="TextBox_7_DUP2--Slide6--17" class="fragment-off" data-fragment-index="2">I am with you always, even to the end of the age”.</text><rect x="490" y="248" width="160" height="32" fill="#7F7F7F" fill-opacity="0.74902" id="TextBox_8_DUP2--Slide6--18" class="fragment-off" data-fragment-index="2" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="24" transform="translate(490.345 273)" id="TextBox_8_DUP2--Slide6--19" class="fragment-off" data-fragment-index="2">Matthew 28:20</text><rect x="670" y="379" width="494" height="65" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_7_DUP3--Slide6--20" class="fragment-off" data-fragment-index="3" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(670.035 404)" id="TextBox_7_DUP3--Slide6--21" class="fragment-off" data-fragment-index="3">From His coming to His mission, Jesus is with</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(670.035 436)" id="TextBox_7_DUP3--Slide6--22" class="fragment-off" data-fragment-index="3">His people.</text><a id="Narration_Slide6--Slide6--23__LINK" href=""><g clip-path="url(#clip2--Narration_Slide6--Slide6--23)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide6--Slide6--23" style="display:none;"><g clip-path="url(#clip4--Narration_Slide6--Slide6--23)"><use width="100%" height="100%" xlink:href="#img3--Narration_Slide6--Slide6--23" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="116.5" y="72.5001" width="1078" height="606" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide6--24" /></g></svg>