agment-off fragment-off" data-fragment-index="3">“and teaching them to obey all that I have commanded you.</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(494.652 293)" id="TextBox_7--Slide6--15" class="fragment-off fragment-off fragment-off" data-fragment-index="3">And</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(544.152 293)" id="TextBox_7--Slide6--16" class="fragment-off fragment-off fragment-off" data-fragment-index="3">surely</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(615.132 293)" id="TextBox_7--Slide6--17" class="fragment-off fragment-off fragment-off" data-fragment-index="3">I am with you always, even to the end of the</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(494.652 325)" id="TextBox_7--Slide6--18" class="fragment-off fragment-off fragment-off" data-fragment-index="3">age”.</text><rect x="494" y="337" width="146" height="27" fill="#7F7F7F" id="TextBox_8--Slide6--19" class="fragment-off fragment-off" data-fragment-index="2" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="700" font-size="22" transform="translate(493.995 358)" id="TextBox_8--Slide6--20" class="fragment-off fragment-off" data-fragment-index="2">Matthew 28:20</text><rect x="654" y="409" width="494" height="64" fill="#7F7F7F" fill-opacity="0.6" id="TextBox_7--Slide6--21" class="fragment-off fragment-off fragment-off" data-fragment-index="3" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(654.429 434)" id="TextBox_7--Slide6--22" class="fragment-off fragment-off fragment-off" data-fragment-index="3">From His coming to His mission, Jesus is with</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(654.429 466)" id="TextBox_7--Slide6--23" class="fragment-off fragment-off fragment-off" data-fragment-index="3">His</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(693.763 466)" id="TextBox_7--Slide6--24" class="fragment-off fragment-off fragment-off" data-fragment-index="3">people</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="26.6667" transform="translate(768.596 466)" id="TextBox_7--Slide6--25" class="fragment-off fragment-off fragment-off" data-fragment-index="3">.</text><a id="Narration_Slide6--Slide6--26__LINK" href=""><g clip-path="url(#clip3--Narration_Slide6--Slide6--26)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide6--Slide6--26" style="display:none;"><g clip-path="url(#clip5--Narration_Slide6--Slide6--26)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide6--Slide6--26" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="116.5" y="72.5001" width="1078" height="606" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide6--27" /></g></svg>