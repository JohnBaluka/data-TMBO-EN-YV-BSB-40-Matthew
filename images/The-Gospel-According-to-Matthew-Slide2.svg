 fill="#0070C0" font-family="Carlito,sans-serif" font-weight="700" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide3--15">Matthew 1:1 · Berean Standard Bible (BSB)</text><a id="Narration_Slide3--Slide3--16__LINK" href=""><g clip-path="url(#clip3--Narration_Slide3--Slide3--16)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide3--Slide3--16" style="display:none;"><g clip-path="url(#clip5--Narration_Slide3--Slide3--16)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide3--Slide3--16" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="16.5001" y="90.5001" width="1236" height="596" stroke="#1C334E" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide3--17" /></g></svg>