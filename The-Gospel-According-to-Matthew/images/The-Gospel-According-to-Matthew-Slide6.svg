<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><style type="text/css"><![CDATA[@font-face{font-family:'Carlito';src:url('fonts/Carlito-normal-normal.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap;}
@font-face{font-family:'Carlito';src:url('fonts/Carlito-bold-normal.ttf') format('truetype');font-weight:bold;font-style:normal;font-display:swap;}
@font-face{font-family:'Carlito';src:url('fonts/Carlito-normal-italic.ttf') format('truetype');font-weight:normal;font-style:italic;font-display:swap;}
@font-face{font-family:'Carlito';src:url('fonts/Carlito-bold-italic.ttf') format('truetype');font-weight:bold;font-style:italic;font-display:swap;}]]></style><clipPath id="clip0--Narration_Slide7--Slide7--21"><rect x="0" y="0" width="609600" height="609600" /></clipPath><image width="64" height="64" xlink:href="images/The-Gospel-According-to-Matthew-Slide6--img1--Narration_Slide7--Slide7--21.png" preserveAspectRatio="none" id="img1--Narration_Slide7--Slide7--21"></image><clipPath id="clip2--Narration_Slide7--Slide7--21"><rect x="-1" y="-0.5" width="609600" height="609600" /></clipPath></defs><g id="gSlide--Slide7"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" id="rectSlide--Slide7--0" /><rect x="0" y="0" width="1280" height="67" fill="#8064A2" id="TitlePlaceholder--Slide7--1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="34" transform="translate(9.6 43)" id="TitlePlaceholder--Slide7--2">How This Series Works</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1193.03 27)" id="SectionNameTextPlaceholder--Slide7--3">This Series</text><path d="M68 172C68 159.85 77.8497 150 90 150 102.15 150 112 159.85 112 172 112 184.15 102.15 194 90 194 77.8497 194 68 184.15 68 172Z" fill="#8064A2" fill-rule="evenodd" id="Oval_5--Slide7--4" class="fragment-off" data-fragment-index="1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(84.4166 179)" id="TextBox_6--Slide7--5" class="fragment-off" data-fragment-index="1">1</text><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(150 179)" id="TextBox_7--Slide7--6" class="fragment-off" data-fragment-index="1">One deck for each of Matthew’s 28 chapters.</text><text fill="#5E4D7A" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(150 213)" id="TextBox_8--Slide7--7" class="fragment-off" data-fragment-index="1">Plus this introduction.</text><path d="M68 292C68 279.85 77.8497 270 90 270 102.15 270 112 279.85 112 292 112 304.15 102.15 314 90 314 77.8497 314 68 304.15 68 292Z" fill="#8064A2" fill-rule="evenodd" id="Oval_9--Slide7--8" class="fragment-off" data-fragment-index="2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(84.4166 299)" id="TextBox_10--Slide7--9" class="fragment-off" data-fragment-index="2">2</text><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(150 299)" id="TextBox_11--Slide7--10" class="fragment-off" data-fragment-index="2">Every verse, in the Berean Standard Bible.</text><text fill="#5E4D7A" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(150 333)" id="TextBox_12--Slide7--11" class="fragment-off" data-fragment-index="2">Public Domain, so the text can be shown and read freely.</text><path d="M68 412C68 399.85 77.8497 390 90 390 102.15 390 112 399.85 112 412 112 424.15 102.15 434 90 434 77.8497 434 68 424.15 68 412Z" fill="#8064A2" fill-rule="evenodd" id="Oval_13--Slide7--12" class="fragment-off" data-fragment-index="3" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(84.4166 419)" id="TextBox_14--Slide7--13" class="fragment-off" data-fragment-index="3">3</text><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(150 419)" id="TextBox_15--Slide7--14" class="fragment-off" data-fragment-index="3">Each verse appears on its own click.</text><text fill="#5E4D7A" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(150 453)" id="TextBox_16--Slide7--15" class="fragment-off" data-fragment-index="3">Only the verses are read aloud; numbers and notes stay unspoken.</text><path d="M68 532C68 519.85 77.8497 510 90 510 102.15 510 112 519.85 112 532 112 544.15 102.15 554 90 554 77.8497 554 68 544.15 68 532Z" fill="#8064A2" fill-rule="evenodd" id="Oval_17--Slide7--16" class="fragment-off" data-fragment-index="4" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(84.4166 539)" id="TextBox_18--Slide7--17" class="fragment-off" data-fragment-index="4">4</text><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(150 539)" id="TextBox_19--Slide7--18" class="fragment-off" data-fragment-index="4">The section headings become the slide titles.</text><text fill="#5E4D7A" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(150 573)" id="TextBox_20--Slide7--19" class="fragment-off" data-fragment-index="4">They are the translators’ own headings, not ours.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide7--20">Introduction to Matthew · Berean Standard Bible (BSB)</text><a id="Narration_Slide7--Slide7--21__LINK" href=""><g clip-path="url(#clip0--Narration_Slide7--Slide7--21)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide7--Slide7--21" style="display:none;"><g clip-path="url(#clip2--Narration_Slide7--Slide7--21)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide7--Slide7--21" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>