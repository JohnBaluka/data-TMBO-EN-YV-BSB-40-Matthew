110 192 110 203.046 101.046 212 90 212 78.9543 212 70 203.046 70 192Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_7--Slide2--5" class="fragment-off" data-fragment-index="1" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(84.9166 199)" id="TextBox_8--Slide2--6" class="fragment-off" data-fragment-index="1">1</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(140 199)" id="TextBox_9--Slide2--7" class="fragment-off" data-fragment-index="1">Traditionally the work of Matthew, the tax collector Jesus called.</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(140 237)" id="TextBox_10--Slide2--8" class="fragment-off" data-fragment-index="1">Matthew 9:9 and 10:3</text><path d="M70 342C70 330.954 78.9543 322 90 322 101.046 322 110 330.954 110 342 110 353.046 101.046 362 90 362 78.9543 362 70 353.046 70 342Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_11--Slide2--9" class="fragment-off" data-fragment-index="2" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(84.9166 349)" id="TextBox_12--Slide2--10" class="fragment-off" data-fragment-index="2">2</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(140 349)" id="TextBox_13--Slide2--11" class="fragment-off" data-fragment-index="2">Written for readers who knew the Hebrew Scriptures.</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(140 387)" id="TextBox_14--Slide2--12" class="fragment-off" data-fragment-index="2">Again and</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(233.093 387)" id="TextBox_14--Slide2--13" class="fragment-off" data-fragment-index="2">again</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(285.52 387)" id="TextBox_14--Slide2--14" class="fragment-off" data-fragment-index="2">it says a thing happened to fulfill the prophets.</text><path d="M70 492C70 480.954 78.9543 472 90 472 101.046 472 110 480.954 110 492 110 503.046 101.046 512 90 512 78.9543 512 70 503.046 70 492Z" fill="#C6AFE4" fill-rule="evenodd" id="Oval_15--Slide2--15" class="fragment-off" data-fragment-index="3" /><text fill="#3A2F4A" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(84.9166 499)" id="TextBox_16--Slide2--16" class="fragment-off" data-fragment-index="3">3</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="32" transform="translate(140 499)" id="TextBox_17--Slide2--17" class="fragment-off" data-fragment-index="3">Its claim: Jesus is the promised King, the Son of David.</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="22" transform="translate(140 537)" id="TextBox_18--Slide2--18" class="fragment-off" data-fragment-index="3">The first verse says so; the last chapter sends His disciples to all nations.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide2--19">Introduction to Matthew · Berean Standard Bible (BSB)</text><a id="Narration_Slide2--Slide2--20__LINK" href=""><g clip-path="url(#clip3--Narration_Slide2--Slide2--20)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide2--Slide2--20" style="display:none;"><g clip-path="url(#clip5--Narration_Slide2--Slide2--20)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide2--Slide2--20" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>