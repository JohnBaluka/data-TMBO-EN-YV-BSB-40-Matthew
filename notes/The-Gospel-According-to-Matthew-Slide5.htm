<p><span id="s6l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video="">And the book is framed by a promise.</span></p><p><span id="s6l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video="">Near the beginning, the child is called Immanuel, which means, God with us.</span></p><p><span id="s6l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video="">At the very end, the risen Jesus says: and surely I am with you always, even to the end of the age. The same promise, opening and closing the book.</span></p>
